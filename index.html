<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InstaFish</title>
<style>
:root{--bg:#f2f7f9;--card:#fff;--tx:#0b2a36;--mu:#5d7783;--pr:#0a7ea4;--ac:#f59e0b;--bd:#dbe7ec}
@media (prefers-color-scheme:dark){:root{--bg:#07181f;--card:#0e2832;--tx:#e8f3f7;--mu:#8aa8b4;--pr:#2bb3de;--bd:#1b3b47}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);max-width:480px;margin:auto;min-height:100vh;padding-bottom:70px}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{font-size:20px;color:var(--pr)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.btn.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
input,textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:15px;margin:6px 0}
.box{padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:12px;overflow:hidden}
.card img{width:100%;display:block;max-height:420px;object-fit:cover}
.pad{padding:12px}
.mu{color:var(--mu);font-size:13px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--bd);display:flex}
nav button{flex:1;background:none;border:0;padding:12px 0;font-size:13px;color:var(--mu);cursor:pointer}
nav button.on{color:var(--pr);font-weight:700}
nav span{display:block;font-size:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:28px;font-weight:700}
.tag{background:var(--ac);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.hidden{display:none}
.lock{text-align:center;padding:24px}
.bar{height:10px;border-radius:5px;background:var(--bd);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ac)}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="box">
  <div id="comp"></div>
  <h1 style="font-size:34px;margin-top:50px">🎣 InstaFish</h1>
  <p class="mu" style="margin-bottom:18px">La red social de los pescadores</p>
  <input id="em" type="email" placeholder="Correo electrónico">
  <input id="pw" type="password" placeholder="Contraseña (mín. 6 caracteres)">
  <p id="msg" class="mu" style="color:#d33"></p>
  <button class="btn" style="width:100%;margin-top:8px" onclick="auth(false)">Entrar</button>
  <button class="btn s" style="width:100%;margin-top:8px" onclick="auth(true)">Crear cuenta</button>
  <p class="mu" id="modo" style="margin-top:14px"></p>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <header><h1>🎣 InstaFish</h1><div style="display:flex;gap:8px"><button class="btn s" onclick="lupa()" aria-label="Buscar">🔍</button><button class="btn s" onclick="salir()">Salir</button></div></header>
  <div id="bbox" class="hidden pad"><input id="bq" placeholder="Buscar pescadores por nombre" oninput="buscar()"><div id="busq"></div></div>

  <section id="v-feed">
    <div class="pad"><div style="display:flex;gap:6px"><button class="btn s" onclick="modo('todas')">Todas</button><button class="btn s" onclick="modo('sig')">Siguiendo</button><button class="btn s" onclick="modo('guard')">Guardados</button></div></div>
    <div id="feed"></div></section>

  <section id="v-nuevo" class="box hidden">
    <h2>Nueva captura</h2>
    <input id="foto" type="file" accept="image/*">
    <input id="esp" placeholder="Especie (ej. Dorada)">
    <input id="lug" placeholder="Lugar">
    <textarea id="txt" rows="3" placeholder="Cuenta tu captura..."></textarea>
    <button class="btn" style="width:100%" onclick="publicar()">Publicar</button>
  </section>

  <section id="v-perfil" class="box hidden"></section>

  <section id="v-premium" class="box hidden">
    <h2>Pesca Pro <span class="tag">PREMIUM</span></h2>
    <div id="bloqueo" class="card lock">
      <p style="font-size:40px">🔒</p>
      <p>Meteorología, mareas, ciclos lunares y los mejores días para pescar.</p>
      <button class="btn" style="margin-top:14px" onclick="activar()">Activar Premium (demo)</button>
    </div>
    <div id="pro" class="hidden">
      <div class="card pad"><div class="mu">Tu zona y tipo de pesca</div>
        <input id="zona" placeholder="Localidad (ej. Tarifa)">
        <select id="tipo" onchange="cargarPro()"><option value="spinning">Spinning</option><option value="surfcasting">Surfcasting</option><option value="bote">Desde bote</option><option value="rio">Río / agua dulce</option><option value="mosca">Mosca</option></select>
        <button class="btn" onclick="buscarZona()">Ver pronóstico</button><p class="mu" id="zn"></p></div>
      <div id="pronos"></div>
      <div class="card pad"><h3>📅 Mi calendario de capturas</h3>
        <input id="cd" type="date"><input id="ce" placeholder="Especie"><input id="cn" placeholder="Notas (cebo, hora...)">
        <button class="btn" onclick="addCap()">Guardar captura</button>
        <p class="mu">Se trae el tiempo de ese día para la zona elegida arriba.</p><div id="cal"></div></div>
    </div>
  </section>

  <nav>
    <button class="on" data-v="feed" onclick="ir('feed')"><span>🏠</span>Inicio</button>
    <button data-v="nuevo" onclick="ir('nuevo')"><span>➕</span>Publicar</button>
    <button data-v="premium" onclick="ir('premium')"><span>🌙</span>Pesca Pro</button>
    <button data-v="perfil" onclick="verPerfil()"><span>👤</span>Perfil</button>
  </nav>
</div>

<!-- Firebase (opcional): se carga solo si pegas tu configuración abajo -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ====== PASO FIREBASE: pega aquí tus datos (Consola Firebase > Configuración del proyecto) ======
const FIREBASE_CONFIG = { apiKey: "AIzaSyCdeQN52QXP2-T5NWKYwZ9OWz6SQDteEUg", authDomain: "instafish-dea74.firebaseapp.com", projectId: "instafish-dea74", appId: "1:970821898333:web:a8ccf3faa985f9fe953db4" };
// ================================================================================================

const usaFB = !!FIREBASE_CONFIG.apiKey && typeof firebase !== "undefined";
if (usaFB) firebase.initializeApp(FIREBASE_CONFIG);
const db = usaFB ? firebase.firestore() : null;
let unsub = null;
document.getElementById("modo").textContent = usaFB ? "Conectado a Firebase ✅" : "Modo demo: las cuentas se guardan solo en este navegador.";

const $ = id => document.getElementById(id);
const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
let user = null;
const demoPosts = [
  {u:"capitan_luis", e:"Lubina", l:"Tarifa", t:"Mañana espectacular al amanecer 🌅", f:"", m:2},
  {u:"marta_pesca", e:"Dorada", l:"Cádiz", t:"Primera dorada del año, a la plancha!", f:"", m:5}
];

async function auth(nuevo){
  const em = $("em").value.trim(), pw = $("pw").value;
  $("msg").textContent = "";
  if (!em || pw.length < 6) { $("msg").textContent = "Escribe un correo y una contraseña de 6+ caracteres."; return; }
  try {
    if (usaFB) {
      const r = nuevo ? await firebase.auth().createUserWithEmailAndPassword(em, pw)
                      : await firebase.auth().signInWithEmailAndPassword(em, pw);
      user = r.user.email;
    } else {
      const us = ls.get("if_users", {});
      if (nuevo) { if (us[em]) throw new Error("Ese correo ya existe"); us[em] = pw; ls.set("if_users", us); }
      else if (us[em] !== pw) throw new Error("Correo o contraseña incorrectos");
      user = em;
    }
    ls.set("if_user", user); entrar();
  } catch(e){ $("msg").textContent = e.message; }
}
function salir(){ if (usaFB) firebase.auth().signOut(); ls.set("if_user", null); user = null; $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
function entrar(){ $("login").classList.add("hidden"); $("app").classList.remove("hidden"); ir("feed"); }

function ir(v){
  ["feed","nuevo","premium","perfil"].forEach(x => $("v-"+x).classList.toggle("hidden", x !== v));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  if (v === "feed") pintarFeed(); if (v === "premium") pintarPro();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function dibujar(todos){
  if (!todos.length) { $("feed").innerHTML = '<p class="box mu">Aún no hay capturas. ¡Sube la primera!</p>'; return; }
  $("feed").innerHTML = todos.map(p => {
    const lk = p.likes ? p.likes.length : (p.m||0), yo = usaFB && p.likes && p.likes.includes(user);
    return `<div class="card">
    ${p.f ? `<img src="${esc(p.f)}" alt="">` : `<div style="height:160px;display:grid;place-items:center;font-size:60px;background:var(--bd)">🐟</div>`}
    <div class="pad"><b ${p.uid ? `style="cursor:pointer" onclick="verPerfil('${esc(p.uid)}')"` : ""}>@${esc(p.u)}</b> · <span class="mu">${esc(p.l||"")}</span> ${p.e ? `<span class="tag">${esc(p.e)}</span>` : ""}
    <p style="margin:6px 0">${esc(p.t||"")}</p>
    <button class="btn s" onclick="like('${esc(p.id||"")}', this)" data-n="${lk}" data-y="${yo ? 1 : 0}">${pez(yo)} ${lk}</button> <button class="btn s" id="cb-${esc(p.id||"")}" onclick="pintarCom('${esc(p.id||"")}',true)">💬</button> <button class="btn s" onclick="guardar('${esc(p.id||"")}',this)">${misGuard.has(p.id) ? "📌" : "🔖"}</button>${p.pub ? ` <button class="btn s" onclick="compartir('${esc(p.id)}')">🔗</button>` : ""}<div id="cm-${esc(p.id||"")}"></div></div></div>`;
  }).join("");
  if (usaFB) todos.forEach(p => p.id && pintarCom(p.id));
}
function like(id, b){
  if (usaFB && id) {
    const yo = b.dataset.y === "1", F = firebase.firestore.FieldValue;
    db.collection("posts").doc(id).update({likes: yo ? F.arrayRemove(user) : F.arrayUnion(user)});
  } else { b.dataset.n = +b.dataset.n + 1; b.innerHTML = pez(true) + " " + b.dataset.n; }
}

function reducir(file){
  return new Promise(ok => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      const k = Math.min(1, 700 / im.width), c = document.createElement("canvas");
      c.width = im.width * k; c.height = im.height * k; c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      ok(c.toDataURL("image/jpeg", .6)); }; im.src = r.result; };
    r.readAsDataURL(file);
  });
}
async function publicar(){
  const f = $("foto").files[0];
  const p = {u:(user||"yo").split("@")[0], e:$("esp").value, l:$("lug").value, t:$("txt").value, f: f ? await reducir(f) : ""};
  try {
    if (usaFB) {
      p.uid = uid(); const pf = await db.collection("users").doc(p.uid).get(); if (pf.exists && pf.data().n) p.u = pf.data().n; p.pub = !!(pf.exists && pf.data().pub); p.likes = []; p.c = firebase.firestore.FieldValue.serverTimestamp();
      await db.collection("posts").add(p);
    } else {
      p.m = 0; const a = ls.get("if_posts", []); a.unshift(p); ls.set("if_posts", a.slice(0, 15));
    }
  } catch(e){ alert("No se pudo publicar: " + e.message); return; }
  ["foto","esp","lug","txt"].forEach(i => $(i).value = "");
  ir("feed");
}

function activar(){ ls.set("if_premium", true); pintarPro(); }
function edadLuna(d){ return (((d.getTime() - Date.UTC(2000,0,6,18,14)) / 864e5) % 29.530588853 + 29.530588853) % 29.530588853; }
function faseLuna(a){
  const n = ["🌑 Nueva","🌒 Creciente","🌓 Cuarto creciente","🌔 Gibosa creciente","🌕 Llena","🌖 Gibosa menguante","🌗 Cuarto menguante","🌘 Menguante"];
  return n[Math.floor(((a / 29.530588853) * 8 + .5)) % 8];
}
const uid = () => firebase.auth().currentUser.uid;
async function verPerfil(id){
  ir("perfil"); const el = $("v-perfil");
  if (!usaFB) { el.innerHTML = '<p class="mu">Los perfiles necesitan Firebase conectado.</p>'; return; }
  id = id || uid(); const me = id === uid(), R = db.collection("users").doc(id);
  const [u, fs, ps] = await Promise.all([R.get(), R.collection("followers").get(), db.collection("posts").where("uid","==",id).get()]);
  const d = u.exists ? u.data() : {}, sigo = fs.docs.some(x => x.id === uid());
  el.innerHTML = `<h2>${esc(d.n||"Pescador")}</h2><p class="mu">🎣 ${esc(d.t||"Sin especificar")} · ${fs.size} seguidores · ${ps.size} capturas</p><p style="margin:8px 0">${esc(d.b||"")}</p>` +
  (me ? `<div class="card pad"><b>Editar mi perfil</b><input id="pn" placeholder="Nombre" value="${esc(d.n||"")}"><input id="pt" placeholder="Tipo de pesca (ej. Spinning, surfcasting)" value="${esc(d.t||"")}"><textarea id="pb" rows="3" placeholder="Descripción">${esc(d.b||"")}</textarea><label class="mu"><input type="checkbox" id="pp" ${d.pub?"checked":""} style="width:auto"> Perfil público: mis capturas se pueden compartir con un enlace</label><br><button class="btn" onclick="guardarPerfil()">Guardar</button></div>`
        : `<button class="btn${sigo?" s":""}" onclick="seguir('${id}',${sigo})">${sigo?"Siguiendo ✓":"Seguir"}</button>`) +
  `<div class="grid" style="margin-top:12px">${ps.docs.map(x => x.data().f ? `<img src="${esc(x.data().f)}" style="width:100%;border-radius:10px">` : "").join("")}</div>`;
}
let modoFeed = "todas", misGuard = new Set();
function modo(m){ modoFeed = m; pintarFeed(); }
async function pintarFeed(){
  if (!usaFB) { dibujar([...ls.get("if_posts", []), ...demoPosts]); return; }
  if (unsub) { unsub(); unsub = null; }
  const me = db.collection("users").doc(uid()), fallo = e => { $("feed").innerHTML = '<p class="box mu">No se pudo cargar: ' + esc(e.message) + '</p>'; };
  try {
    misGuard = new Set((await me.collection("saved").get()).docs.map(d => d.id));
    if (modoFeed === "todas") {
      unsub = db.collection("posts").orderBy("c","desc").limit(30).onSnapshot(sn => dibujar(sn.docs.map(d => ({id:d.id, ...d.data()}))), fallo);
    } else if (modoFeed === "guard") {
      const ps = await Promise.all([...misGuard].map(id => db.collection("posts").doc(id).get()));
      dibujar(ps.filter(d => d.exists).map(d => ({id:d.id, ...d.data()})));
    } else {
      const ids = (await me.collection("following").get()).docs.map(d => d.id).slice(0, 10);
      if (!ids.length) { dibujar([]); return; }
      const s = await db.collection("posts").where("uid","in",ids).limit(30).get();
      dibujar(s.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => (b.c ? b.c.seconds : 0) - (a.c ? a.c.seconds : 0)));
    }
  } catch(e){ fallo(e); }
}
async function guardar(id, b){
  if (!usaFB || !id) return; const r = db.collection("users").doc(uid()).collection("saved").doc(id);
  if (misGuard.has(id)) { await r.delete(); misGuard.delete(id); } else { await r.set({c:firebase.firestore.FieldValue.serverTimestamp()}); misGuard.add(id); }
  if (modoFeed === "guard") pintarFeed(); else b.textContent = misGuard.has(id) ? "📌" : "🔖";
}
async function compartir(id){
  const url = location.origin + location.pathname + "?post=" + id;
  try { if (navigator.share) { await navigator.share({title:"InstaFish", url}); return; } await navigator.clipboard.writeText(url); alert("Enlace copiado. Cualquiera con el enlace puede ver esta captura."); }
  catch(e){ prompt("Copia este enlace:", url); }
}
async function buscar(){
  const q = $("bq").value.trim().toLowerCase();
  if (!q || !usaFB) { $("busq").innerHTML = ""; return; }
  const s = await db.collection("users").where("nl", ">=", q).where("nl", "<=", q + "\uf8ff").limit(10).get();
  $("busq").innerHTML = s.docs.map(d => `<div class="card pad" style="cursor:pointer" onclick="$('bbox').classList.add('hidden');verPerfil('${d.id}')"><b>${esc(d.data().n)}</b> <span class="mu">🎣 ${esc(d.data().t||"")}</span></div>`).join("") || '<p class="mu box">No encontré a nadie con ese nombre.</p>';
}
const pid = new URLSearchParams(location.search).get("post");
if (usaFB && pid) db.collection("posts").doc(pid).get().then(d => { if (d.exists) { const p = d.data(); $("comp").innerHTML = `<div class="card">${p.f ? `<img src="${esc(p.f)}" alt="">` : ""}<div class="pad"><b>@${esc(p.u)}</b> ${p.e ? `<span class="tag">${esc(p.e)}</span>` : ""}<p>${esc(p.t||"")}</p><p class="mu">Crea tu cuenta o entra para seguir a @${esc(p.u)}.</p></div></div>`; } }).catch(() => {});
async function guardarPerfil(){
  const n = $("pn").value.trim(), pub = $("pp").checked;
  await db.collection("users").doc(uid()).set({n, nl:n.toLowerCase(), t:$("pt").value.trim(), b:$("pb").value.trim(), pub}, {merge:true});
  const ps = await db.collection("posts").where("uid","==",uid()).get(), bt = db.batch();
  ps.docs.forEach(d => bt.update(d.ref, {pub})); await bt.commit(); verPerfil();
}
async function seguir(id, sigo){
  const F = firebase.firestore.FieldValue, t = db.collection("users").doc(id).collection("followers").doc(uid()), m = db.collection("users").doc(uid()).collection("following").doc(id), b = db.batch();
  if (sigo) { b.delete(t); b.delete(m); } else { b.set(t, {c:F.serverTimestamp()}); b.set(m, {c:F.serverTimestamp()}); }
  await b.commit(); verPerfil(id);
}

const pez = on => `<svg width="24" height="15" viewBox="0 0 32 20" style="vertical-align:middle"><path d="M2 10c5-8 15-9 20-2l8-6v16l-8-6c-5 7-15 6-20-2z" fill="${on ? "#f59e0b" : "none"}" stroke="#f59e0b" stroke-width="2" stroke-linejoin="round"/><circle cx="8" cy="9" r="1.6" fill="${on ? "#fff" : "#f59e0b"}"/></svg>`;
function lupa(){ const b = $("bbox"); b.classList.toggle("hidden"); if (!b.classList.contains("hidden")) $("bq").focus(); }
async function pintarCom(id, todos){
  const el = $("cm-" + id); if (!el) return;
  const s = await db.collection("posts").doc(id).collection("comments").orderBy("c").limit(100).get(), n = s.size;
  if ($("cb-" + id)) $("cb-" + id).textContent = "💬 " + n;
  el.innerHTML = s.docs.slice(0, todos ? n : 3).map(d => `<p style="margin:4px 0"><b>@${esc(d.data().u)}</b> ${esc(d.data().t)}</p>`).join("") +
    (n > 3 && !todos ? `<p class="mu" style="cursor:pointer" onclick="pintarCom('${id}',true)">Ver los ${n} comentarios</p>` : "") +
    `<input id="ci-${id}" placeholder="Añade un comentario…"><button class="btn s" onclick="enviarCom('${id}')">Enviar</button>`;
}
async function enviarCom(id){
  const t = $("ci-"+id).value.trim(); if (!t) return;
  await db.collection("posts").doc(id).collection("comments").add({t, u:user.split("@")[0], uid:uid(), c:firebase.firestore.FieldValue.serverTimestamp()});
  abrirCom(id);
}

const LIM = {spinning:[25,1.5], surfcasting:[30,2.5], bote:[20,1], rio:[30,99], mosca:[18,99]};
let cal = new Date(), caps = [];
function pintarPro(){
  const p = ls.get("if_premium", false);
  $("bloqueo").classList.toggle("hidden", p); $("pro").classList.toggle("hidden", !p);
  if (!p) return;
  $("tipo").value = ls.get("if_tipo", "spinning");
  const z = ls.get("if_zona", null); $("zn").textContent = z ? "📍 " + z.n : "Elige una localidad para ver tu pronóstico.";
  if (z) cargarPro();
  cal = new Date(); cal.setDate(1); pintarCal();
}
async function buscarZona(){
  const q = $("zona").value.trim(); if (!q) return;
  try {
    const r = await (await fetch("https://geocoding-api.open-meteo.com/v1/search?count=1&language=es&name=" + encodeURIComponent(q))).json();
    if (!r.results) { $("zn").textContent = "No encuentro ese lugar."; return; }
    const z = r.results[0]; ls.set("if_zona", {n: z.name + (z.admin1 ? ", " + z.admin1 : ""), lat: z.latitude, lon: z.longitude});
    $("zn").textContent = "📍 " + z.name; cargarPro();
  } catch(e){ $("zn").textContent = "No hay conexión con el servicio del tiempo."; }
}
async function cargarPro(){
  const z = ls.get("if_zona", null); if (!z) return;
  const t = $("tipo").value; ls.set("if_tipo", t); const L = LIM[t];
  $("pronos").innerHTML = '<p class="mu box">Cargando…</p>';
  try {
    const q = `latitude=${z.lat}&longitude=${z.lon}&timezone=auto&forecast_days=7`;
    const [w, m] = await Promise.all([
      fetch(`https://api.open-meteo.com/v1/forecast?${q}&current=temperature_2m,pressure_msl,wind_speed_10m&hourly=wind_speed_10m,precipitation_probability`).then(r => r.json()),
      fetch(`https://marine-api.open-meteo.com/v1/marine?${q}&current=sea_surface_temperature&hourly=wave_height,sea_level_height_msl`).then(r => r.json()).catch(() => ({}))]);
    const H = w.hourly, M = m.hourly || {}, c = w.current || {}, mc = m.current || {};
    const av = (a, i) => { if (!a) return null; const v = a.slice(i*24+6, i*24+21).filter(n => n != null); return v.length ? v.reduce((s, n) => s + n, 0) / v.length : null; };
    let h = "";
    for (let i = 0; i < 7; i++) {
      const f = new Date(H.time[i*24]), v = av(H.wind_speed_10m, i) || 0, o = av(M.wave_height, i), r = av(H.precipitation_probability, i) || 0;
      const lu = edadLuna(new Date(f.getTime() + 12*36e5)), near = Math.min(lu % 14.765, 14.765 - lu % 14.765);
      const s = Math.max(0, Math.min(100, Math.round(100 - Math.max(0, (v - L[0]) * 3) - Math.max(0, ((o || 0) - L[1]) * 30) - r * .3 + (near < 2 ? 10 : 0))));
      h += `<div class="card pad"><b>${f.toLocaleDateString("es-ES",{weekday:"long",day:"numeric"})}</b> ${faseLuna(lu).slice(0,2)}<div class="bar"><i style="width:${s}%"></i></div><p class="mu">Índice ${s}/100 · viento ${Math.round(v)} km/h · oleaje ${o == null ? "—" : o.toFixed(1) + " m"} · lluvia ${Math.round(r)}%</p></div>`;
    }
    let md = ""; const S = (M.sea_level_height_msl || []).slice(0, 24);
    if (S.length && S[0] != null) { const lo = Math.min(...S), hi = Math.max(...S); for (let k = 0; k < 24; k += 3) md += `<div class="mu" style="margin-top:6px">${String(k).padStart(2,"0")}:00 · ${S[k].toFixed(2)} m</div><div class="bar"><i style="width:${(S[k]-lo)/(hi-lo||1)*100}%"></i></div>`; }
    else md = '<p class="mu">Sin datos de marea para esta zona.</p>';
    $("pronos").innerHTML = `<div class="card pad"><div class="mu">Ahora en ${esc(z.n)}</div><div class="grid" style="margin-top:8px"><div>🌡️ Aire<div class="big">${Math.round(c.temperature_2m)}°C</div></div><div>🌊 Agua<div class="big">${mc.sea_surface_temperature == null ? "—" : Math.round(mc.sea_surface_temperature) + "°C"}</div></div><div>💨 Viento<div class="big">${Math.round(c.wind_speed_10m)} km/h</div></div><div>🧭 Presión<div class="big">${Math.round(c.pressure_msl)} hPa</div></div></div></div><div class="card pad"><div class="mu">Mareas hoy (modelo global, orientativo)</div>${md}</div>` + h + '<p class="mu box">Datos: Open-Meteo. Son estimaciones de modelos meteorológicos y el índice de pesca es orientativo (viento, oleaje, lluvia y luna según tu tipo de pesca): ninguna fuente es 100% exacta.</p>';
  } catch(e){ $("pronos").innerHTML = '<p class="mu box">No se pudo cargar el pronóstico. Revisa tu conexión.</p>'; }
}

async function pintarCal(){
  if (!usaFB) { $("cal").innerHTML = '<p class="mu">Necesita Firebase conectado.</p>'; return; }
  const s = await db.collection("users").doc(uid()).collection("catches").orderBy("d","desc").limit(500).get();
  caps = s.docs.map(d => ({id:d.id, ...d.data()})); dibCal();
}
function dibCal(){
  const y = cal.getFullYear(), m = cal.getMonth(), ini = (new Date(y, m, 1).getDay() + 6) % 7, n = new Date(y, m + 1, 0).getDate();
  const k = d => y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
  let g = "<div></div>".repeat(ini);
  for (let d = 1; d <= n; d++) g += `<div style="text-align:center;padding:6px 0;border-radius:8px;${caps.some(x => x.d === k(d)) ? "background:var(--ac);color:#fff" : ""}">${d}</div>`;
  const mes = caps.filter(x => x.d.slice(0, 7) === k(1).slice(0, 7));
  $("cal").innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center"><button class="btn s" onclick="cal.setMonth(cal.getMonth()-1);dibCal()">◀</button><b>${cal.toLocaleDateString("es-ES",{month:"long",year:"numeric"})}</b><button class="btn s" onclick="cal.setMonth(cal.getMonth()+1);dibCal()">▶</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0">${g}</div>` +
    (mes.map(x => `<div class="card pad"><b>${x.d}</b> ${esc(x.e)} <span class="mu">${esc(x.l||"")}</span><p class="mu">${esc(x.k||"")}</p><p>${esc(x.t||"")}</p></div>`).join("") || '<p class="mu">Sin capturas este mes.</p>');
}
async function addCap(){
  const d = $("cd").value, e = $("ce").value.trim(), z = ls.get("if_zona", null);
  if (!d || !e) { alert("Pon la fecha y la especie."); return; }
  let k = "";
  if (z) { try {
    const r = await (await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${z.lat}&longitude=${z.lon}&start_date=${d}&end_date=${d}&hourly=temperature_2m,pressure_msl,wind_speed_10m&timezone=auto`)).json();
    const a = x => { const v = r.hourly[x].filter(n => n != null); return v.length ? Math.round(v.reduce((s, n) => s + n, 0) / v.length) : "?"; };
    k = a("temperature_2m") + "°C · viento " + a("wind_speed_10m") + " km/h · " + a("pressure_msl") + " hPa · ";
  } catch(e){} }
  k += faseLuna(edadLuna(new Date(d + "T12:00")));
  await db.collection("users").doc(uid()).collection("catches").add({d, e, l: z ? z.n : "", t: $("cn").value, k});
  ["cd","ce","cn"].forEach(i => $(i).value = ""); pintarCal();
}

// Recordar sesión
if (usaFB) {
  firebase.auth().onAuthStateChanged(u => {
    if (u) { user = u.email; entrar(); }
    else { user = null; if (unsub) unsub(); $("app").classList.add("hidden"); $("login").classList.remove("hidden"); }
  });
} else { user = ls.get("if_user", null); if (user) entrar(); }
</script>
